<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes projets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0ec; --card:#fff; --ink:#1c2526; --muted:#5f6b68; --line:#d9ddd8;
  --soft:#e2e7e3; --primary:#2f5e4e; --primary-ink:#fff; --danger:#c8323c;
  --danger-bg:#fbe3e6; --danger-line:#d97b84; --pill:#e4e8e5; --pill-ink:#4c5654;
  --warn:#c9952b; --warn-bg:#fbf7ee; --field:#f6f7f5; --check:#c9cfcc; --faint:#cfd4d2;
  --chip-on:#1c2526; --chip-on-ink:#fff; --chip-on-muted:#aab3b1; --hover:rgba(0,0,0,.05);
  --backdrop:rgba(20,30,28,.45); --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a19; --card:#1d2523; --ink:#e7ecea; --muted:#9aa7a3; --line:#2f3a37;
  --soft:#222c2a; --primary:#5aa58a; --primary-ink:#0f1614; --danger:#ec6b74;
  --danger-bg:#3a2226; --danger-line:#8a3d45; --pill:#2c3633; --pill-ink:#c4cecb;
  --warn:#d9a640; --warn-bg:#2c2618; --field:#182020; --check:#4a5653; --faint:#46524f;
  --chip-on:#e7ecea; --chip-on-ink:#141a19; --chip-on-muted:#5f6b68; --hover:rgba(255,255,255,.07);
  --backdrop:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a19; --card:#1d2523; --ink:#e7ecea; --muted:#9aa7a3; --line:#2f3a37;
  --soft:#222c2a; --primary:#5aa58a; --primary-ink:#0f1614; --danger:#ec6b74;
  --danger-bg:#3a2226; --danger-line:#8a3d45; --pill:#2c3633; --pill-ink:#c4cecb;
  --warn:#d9a640; --warn-bg:#2c2618; --field:#182020; --check:#4a5653; --faint:#46524f;
  --chip-on:#e7ecea; --chip-on-ink:#141a19; --chip-on-muted:#5f6b68; --hover:rgba(255,255,255,.07);
  --backdrop:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Instrument Sans",system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:clamp(30px,5vw,42px);line-height:1;margin:0 0 14px;letter-spacing:-.03em}
.summary{color:var(--muted);margin:0 0 28px;font-size:14px}
.summary b{color:var(--ink)}

/* Quick add */
.quick{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px 14px;margin-bottom:28px}
.quick input[type=text]{width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 2px 10px;font-size:16px;outline:none;background:transparent}
.quick-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
select,.input{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;min-width:0}
.quick-row select{flex:0 1 240px}
.quick-row .grow{flex:1}
.btn{border-radius:8px;padding:7px 14px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--card)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.danger{color:var(--danger);border-color:var(--danger-line)}
.btn.small{padding:6px 12px;font-size:12px}

/* Tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.tab{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 8px;font-weight:600;font-size:14px;text-align:center}
.tab .n{color:var(--muted);font-weight:500;margin-left:6px;font-size:13px}
.tab.urgent{color:var(--danger)}
.tab.urgent.active{border-color:var(--danger);background:var(--danger-bg)}
.tab.active{border-color:var(--warn);background:var(--warn-bg)}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;scrollbar-width:thin}
.chip{flex:none;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:500;font-size:14px;white-space:nowrap}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip .n{color:var(--muted);font-size:13px}
.chip.active{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chip.active .n{color:var(--chip-on-muted)}
.chip.add{color:var(--muted);border-style:dashed}

/* Objective */
.objective{border-left:4px solid var(--c,var(--primary));padding:4px 0 4px 20px;margin-bottom:28px}
.objective small{color:var(--muted);font-size:12px;display:block;margin-bottom:4px}
.objective .link{color:var(--primary);font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:4px}
.objective .text{font-size:15px;font-weight:600}
.objective textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px}
.proj-tools{display:flex;justify-content:flex-end;gap:8px;margin:-12px 0 12px}
.linkbtn{color:var(--muted);font-size:11px;text-decoration:underline;text-underline-offset:3px}

/* Sections */
.week{background:var(--soft);border-radius:var(--radius);padding:16px 14px 14px;margin-bottom:28px}
.week h2{margin:0 0 6px;font-size:19px}
.week .sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.week .sub b{color:var(--ink)}
h2.section{font-size:21px;margin:0 0 14px;display:flex;align-items:baseline;gap:10px}
h2.section .n,.theme-h .n{color:var(--muted);font-weight:500;font-size:14px}
.theme{margin-bottom:22px}
.theme-h{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:10px}
.theme-h .name{font-weight:600;font-size:16px}
.theme-h .caret{font-size:9px;color:var(--muted);width:16px;transition:transform .15s}
.theme.closed .caret{transform:rotate(-90deg)}
.theme.closed .list{display:none}
.icon{color:var(--muted);font-size:14px;padding:2px 4px;border-radius:4px;line-height:1}
.icon:hover{color:var(--ink);background:var(--hover)}
.add-theme{display:flex;gap:10px;margin-top:10px}
.add-theme input{flex:1;border:1px dashed var(--check);background:transparent;border-radius:8px;padding:12px 14px}
.empty{color:var(--muted);font-style:italic;padding:6px 2px}

/* Cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:10px 10px 10px 12px;position:relative}
.card.flag{background:var(--danger-bg);border-color:var(--danger-line);border-left-color:var(--danger)}
.card.done .title{text-decoration:line-through;color:var(--muted)}
.card-main{display:flex;gap:12px;align-items:center;min-height:24px}
.check{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--check);background:var(--card);display:grid;place-items:center;color:var(--primary-ink);font-size:11px}
.check:hover{border-color:var(--primary)}
.check.on{background:var(--primary);border-color:var(--primary)}
.body{flex:1;min-width:0;cursor:pointer}
.title{font-size:15px;font-weight:500;line-height:1.35;margin-right:8px}
.title-row{display:flex;flex-wrap:wrap;align-items:center;row-gap:4px}
.pill{display:inline-block;background:var(--pill);color:var(--pill-ink);font-weight:600;font-size:12px;border-radius:999px;padding:2px 10px;line-height:1.4}
.pill.late{background:var(--danger);color:var(--card)}
.meta{color:var(--muted);font-size:12px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 14px}
.meta .theme-tag{color:var(--primary);font-weight:600}
.meta .proj-tag{font-weight:600}
.actions{flex:none;display:flex;align-items:center;gap:4px}
.flagbtn{color:var(--faint)}
.flagbtn.on{color:var(--danger)}
.subs{margin:8px 0 2px 58px;display:flex;flex-direction:column;gap:6px}
.subrow{display:flex;align-items:center;gap:10px;font-size:13px}
.subrow .check{width:16px;height:16px;font-size:9px}
.subrow.done span.t{text-decoration:line-through;color:var(--muted)}
.subrow .m{color:var(--muted);font-size:11px}
.subrow .m.late{color:var(--danger);font-weight:600}
.group-title{font-weight:600;font-size:14px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.group-title .dot{width:10px;height:10px;border-radius:50%}
details.done-sec summary{cursor:pointer;color:var(--muted);font-weight:600;margin:30px 0 10px}
.footer{margin-top:60px;display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:11px}

/* Chantier (villa) */
.site{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);overflow:hidden;margin-bottom:28px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;transition:box-shadow .3s}
.site-wrap{position:relative;flex:none;transition:width .35s ease,height .35s ease}
.site-scene{display:block;width:100%;height:100%;background:#bfe6f7}
/* Mode compact : la villa reste visible en haut pendant qu'on fait défiler les tâches */
.site.compact{display:flex;align-items:center;box-shadow:0 10px 28px rgba(0,0,0,.16)}
.site.compact .site-info{flex:1;min-width:0;padding:8px 12px;gap:5px}
.site.compact .site-steps,.site.compact .site-next,.site.compact .site-top .linkbtn,.site.compact .site-run{display:none}
.site.compact .site-top h2{font-size:14px}
.site.compact .site-stage{font-size:12px;line-height:1.3}
.site.compact .site-bar{height:7px}
@media (max-width:560px){.site.compact .site-top{display:none}.site.compact .site-stage span{display:none}}
.site-info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.site-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.site-top h2{margin:0;font-size:19px}
.site-top .tools{display:flex;gap:10px;align-items:center}
.site-top select{font-size:12px;padding:4px 8px}
.site-stage{font-size:15px;font-weight:600}
.site-stage small{color:var(--muted);font-weight:500;margin-right:6px;font-variant-numeric:tabular-nums}
.site-bar{height:10px;border-radius:999px;background:var(--pill);overflow:hidden}
.site-bar span{display:block;height:100%;background:linear-gradient(90deg,#d9a640,#f2c94c);border-radius:inherit;transition:width .6s ease}
.site-next{color:var(--muted);font-size:13px}
.site-next b{color:var(--ink)}
.site-steps{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.site-steps i{height:6px;border-radius:3px;background:var(--pill)}
.site-steps i.on{background:#d9a640}
.site-steps i.cur{background:linear-gradient(90deg,#d9a640 var(--f),var(--pill) var(--f))}
.site-run{position:absolute;left:10px;top:10px;right:10px;display:flex;align-items:center;gap:10px;background:rgba(20,26,25,.72);color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;max-width:460px}
.site-run span{flex:1;min-width:0}
.site-run[hidden]{display:none}
.site-run button{color:#fff;font-weight:600;font-size:12px;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:4px 10px}
/* Boucles d'ambiance (transform/opacity uniquement) */
.s-cloud{animation:s-cloud 70s linear infinite alternate}
@keyframes s-cloud{to{transform:translateX(-140px)}}
.s-boat{animation:s-boat 90s ease-in-out infinite alternate}
@keyframes s-boat{to{transform:translateX(220px)}}
.s-shim{animation:s-shim 4s ease-in-out infinite}
.s-shim:nth-child(2n){animation-delay:-2s}
@keyframes s-shim{0%,100%{opacity:.15}50%{opacity:.7}}
.s-bird{animation:s-bird 40s linear infinite}
@keyframes s-bird{from{transform:translateX(0)}to{transform:translateX(-1100px)}}
.site .arm{animation:s-dig 5s ease-in-out infinite}
@keyframes s-dig{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
.site .hook{animation:s-swing 4s ease-in-out infinite}
@keyframes s-swing{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-2deg)}}
.site .drum{animation:s-drum 1.6s linear infinite}
@keyframes s-drum{to{transform:translateX(-24px)}}
.s-wk{animation:s-wk .9s ease-in-out infinite alternate}
.s-wk.b{animation-delay:-.45s}
@keyframes s-wk{to{transform:translateY(-2px)}}
.s-fw{animation:s-fw 2.8s ease-out infinite;opacity:0}
.s-fw.b{animation-delay:-1s}.s-fw.c{animation-delay:-1.9s}
@keyframes s-fw{0%{opacity:0;transform:scale(.2)}15%{opacity:1}100%{opacity:0;transform:scale(1)}}
.s-bulb{animation:s-shim 2.4s ease-in-out infinite}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--chip-on);color:var(--chip-on-ink);padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px);animation:toast 4.5s ease both}
.toast small{display:block;font-weight:500;opacity:.75}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,10px)}}
@media (prefers-reduced-motion:reduce){.s-cloud,.s-boat,.s-shim,.s-bird,.site .arm,.site .hook,.site .drum,.s-wk,.s-fw,.s-bulb,.toast{animation:none}.s-fw{opacity:.8}}

/* Calendrier de publication */
.cal{border:1px solid var(--line);border-top:4px solid var(--c);background:var(--card);border-radius:var(--radius);padding:16px 14px 14px;margin-bottom:28px}
.cal-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:12px}
.cal-h h2{margin:0;font-size:19px}
.cal-h .sub{color:var(--muted);font-size:13px}
.cal-month{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cal-mlabel{font-weight:600;font-size:13px;text-transform:capitalize;padding-top:6px}
.cal-mlabel small{display:block;color:var(--muted);font-weight:400}
.cal-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;min-width:0}
.slot{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:78px;background:var(--bg);min-width:0}
.slot.free{border-style:dashed;background:transparent}
.slot.past{opacity:.6}
.slot.next{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.slot.drop-over{border-color:var(--primary);border-style:solid;background:var(--hover)}
.slot-date{font-size:12px;color:var(--muted);display:flex;align-items:baseline;gap:5px}
.slot-date b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.slot-date .tag{margin-left:auto;font-size:11px;font-weight:600;color:var(--c)}
.slot-add{color:var(--muted);font-size:13px;text-align:left;padding:4px 2px;margin-top:auto}
.slot-add:hover{color:var(--primary)}
.card.mini{padding:6px 8px;border-left-width:4px;border-radius:8px}
.card.mini .card-main{gap:6px;min-height:0;align-items:flex-start}
.card.mini .handle{align-self:flex-start;padding-top:1px}
.card.mini .check{width:16px;height:16px;font-size:10px;margin-top:1px}
.card.mini .title{font-size:13px;margin:0;word-break:break-word}
.card.mini .meta{font-size:11px;margin-top:2px}
.card.late-pub{border-color:var(--danger-line)}
@media (max-width:640px){.cal-month{grid-template-columns:1fr;gap:6px}.cal-slots{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Glisser-déposer */
.handle{flex:none;align-self:center;cursor:grab;color:var(--faint);font-size:14px;letter-spacing:-3px;padding:4px 4px 4px 0;touch-action:none;user-select:none}
.handle:hover{color:var(--muted)}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;box-shadow:0 10px 30px rgba(0,0,0,.18);transform:rotate(1deg);margin:0}
.dragging,.dragging *{cursor:grabbing!important;user-select:none}
.drag-src{opacity:.35}
.drop-line{height:3px;border-radius:2px;background:var(--primary);margin:-2px 0}
.theme.drop-over>.theme-h{color:var(--primary);border-bottom-color:var(--primary)}
.theme.drop-over.closed>.theme-h,.theme.drop-over .list:empty{background:var(--hover)}
.chip.drop-over{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary)}
.drop-only{display:none}
.dragging .drop-only{display:block}
.drop-only .list{min-height:36px;border:1px dashed var(--check);border-radius:10px}
.chip-ghost{position:fixed;z-index:50;pointer-events:none;opacity:.9}
.chip-line{flex:none;width:3px;align-self:stretch;border-radius:2px;background:var(--primary)}
.order-row{display:flex;align-items:center;gap:8px}

/* Modal */
dialog{border:0;border-radius:16px;padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 40px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:var(--backdrop)}
.modal{padding:22px}
.modal h3{margin:0 0 16px;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11px;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check-line{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sub-edit{display:grid;grid-template-columns:22px 1fr 150px 90px 28px;gap:8px;align-items:center;margin-bottom:8px}
.sub-edit .input{padding:8px 10px;font-size:12px}
.sub-head{display:grid;grid-template-columns:22px 1fr 150px 90px 28px;gap:8px;font-size:10px;color:var(--muted);font-weight:600;margin-bottom:6px}
.modal-foot{display:flex;gap:10px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
.modal-foot .right{display:flex;flex-direction:row-reverse;gap:10px;margin-left:auto}
.ask-area{width:100%;min-height:160px;font:13px/1.4 ui-monospace,Menlo,monospace}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--ink)}
.hint{color:var(--muted);font-size:10px;margin-top:-6px;margin-bottom:12px}

@media (max-width:640px){
  .tabs{grid-template-columns:1fr 1fr}
  .quick-row select{flex:1 1 45%}
  .sub-edit,.sub-head{grid-template-columns:22px 1fr 28px}
  .sub-edit .d,.sub-edit .e{grid-column:2}
  .sub-head span:nth-child(n+3){display:none}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="dlg"></dialog>
<dialog id="ask"></dialog>

<script>
/* ---------- Données ---------- */
const KEY = 'gestiondetaches.v1';
const PALETTE = ['#2f6b4f','#c8323c','#3b55b5','#9b4dbb','#d08a1e','#2a8a9a','#6b6b6b','#b5487a'];
const uid = () => Math.random().toString(36).slice(2, 10);

function seed() {
  const p = (name, color) => ({ id: uid(), name, color, objective: '' });
  const projects = [p('Clients actuels', PALETTE[0]), p('Offre high ticket', PALETTE[1]), p('Le studio', PALETTE[2]), p('Meeting Mouvement', PALETTE[3])];
  const studio = projects[2].id;
  const th = name => ({ id: uid(), projectId: studio, name, collapsed: false });
  const themes = [th('Location pour création de contenu'), th('Loyers récurrents'), th('Gestion du studio')];
  return { v: 2, projects, themes, tasks: [] };
}

let db;
try { db = JSON.parse(localStorage.getItem(KEY)) } catch (e) { db = null }
if (!db || !db.projects) db = seed();
// v2 : retire les tâches d'exemple créées par la première version
if (!db.v) {
  const SAMPLES = ['Gérer les travaux au studio', 'Renégocier le loyer de Gabriel', 'Offre de shooting vidéo PREMIUM avec vidéaste pro', 'Offre de shooting photo PREMIUM avec Sarah', 'Proposer le studio à des coachs pour créer du contenu', 'Proposer le studio à louer à des profs de Yoga / Pilates / autres', 'Renégocier le loyer de Clara', 'Société de ménage récurrente'];
  db.tasks = db.tasks.filter(t => !SAMPLES.includes(t.title));
  db.v = 2;
}
// Ajout ponctuel : plan « Livre offert » du projet chakras. N'efface rien ; ne s'ajoute qu'une fois (même après un import).
const LIVRE_THEME = 'Livre offert — Amazon & Lulu';
if (!db.themes.some(t => t.name === LIVRE_THEME)) {
  let pj = db.projects.find(p => /chakra|six lotus|sept roues/i.test(p.name));
  if (!pj) { pj = { id: uid(), name: 'Chakra', color: PALETTE[3], objective: '' }; db.projects.push(pj) }
  const thId = uid(), now = Date.now();

/* ---------- Dates & durées ---------- */
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d };
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d) };
const daysFromToday = s => Math.round((parseDate(s) - today0()) / 86400000);
const fmtDate = s => parseDate(s).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
function fmtDur(m) {
  if (!m) return '';
  const h = Math.floor(m / 60), r = m % 60;
  if (!h) return r + ' min';
  return r ? `${h} h ${String(r).padStart(2, '0')}` : `${h} h`;
}
function parseDur(s) {
  s = String(s || '').trim().toLowerCase().replace(',', '.');
  if (!s) return 0;
  let m = s.match(/^(\d+(?:\.\d+)?)\s*h\s*(\d+)?\s*(?:min)?$/);
  if (m) return Math.round(parseFloat(m[1]) * 60) + (+m[2] || 0);
  m = s.match(/^(\d+)\s*(?:min|mn|m)?$/);
  return m ? +m[1] : 0;
}

/* ---------- Logique tâches ---------- */
const openSubs = t => t.subgoals.filter(s => !s.done);
const nextSubDeadline = t => openSubs(t).map(s => s.due).filter(Boolean).sort()[0] || null;
const nextDeadline = t => [t.due, t.pub, nextSubDeadline(t)].filter(Boolean).sort()[0] || null;
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const totalEst = t => t.subgoals.length ? t.subgoals.reduce((a, s) => a + (s.est || 0), 0) : (t.est || 0);
function bucket(t) {
  const d = nextDeadline(t);
  if (d) { const n = daysFromToday(d); if (n <= 0) return 'today'; if (n < 7) return 'week' }
  return 'later';
}
const inWeek = t => bucket(t) !== 'later';
const active = () => db.tasks.filter(t => !t.done);
const project = id => db.projects.find(p => p.id === id);
const theme = id => db.themes.find(t => t.id === id);
const projThemes = pid => db.themes.filter(t => t.projectId === pid);

// Travail des 7 prochains jours : sous-objectifs (ou tâche sans sous-objectif) dont l'échéance tombe dans la semaine
function weekLoad(tasks) {
  let min = 0, missing = 0;
  for (const t of tasks) {
    const items = t.subgoals.length ? openSubs(t).filter(s => s.due && daysFromToday(s.due) < 7) : (t.due && daysFromToday(t.due) < 7 ? [t] : []);
    for (const i of items) { if (i.est) min += i.est; else missing++ }
  }
  return { min, missing };
}

const plural = (n, s, p) => `${n} ${n > 1 ? (p || s + 's') : s}`;

function sortTasks(list) {
  return list.sort((a, b) => (b.flagged - a.flagged) || ((nextDeadline(a) || '9999') < (nextDeadline(b) || '9999') ? -1 : (nextDeadline(a) || '9999') > (nextDeadline(b) || '9999') ? 1 : a.createdAt - b.createdAt));
}

// Ordre manuel (glisser-déposer) ; les tâches jamais déplacées gardent leur ordre de création
const sortManual = list => list.sort((a, b) => (a.order ?? a.createdAt) - (b.order ?? b.createdAt));

function renderProject(p) {
  const tasks = db.tasks.filter(t => t.projectId === p.id);
  const open = tasks.filter(t => !t.done);
  const week = sortTasks(open.filter(t => inWeek(t) || t.flagged));
  const waiting = open.filter(t => !week.includes(t) && !t.pub);
  const done = tasks.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const load = weekLoad(week);
  const themes = projThemes(p.id);
  const noTheme = waiting.filter(t => !t.themeId || !theme(t.themeId));

      ${week.length ? `<p class="sub">Environ <b>${fmtDur(load.min) || '0 h'}</b> de travail estimé sur 7 jours${load.missing ? `, ${plural(load.missing, 'élément')} sans estimation` : ''}.</p>
        <div class="list">${week.map(t => card(t, { showTheme: true })).join('')}</div>`
        : `<p class="sub">Rien de prévu dans les 7 prochains jours.</p>`}
    </section>

    <h2 class="section">En attente <span class="n">${waiting.length}</span></h2>
    ${themes.map(th => {
      const list = sortManual(waiting.filter(t => t.themeId === th.id));
      return `<div class="theme ${th.collapsed ? 'closed' : ''}" data-drop="${th.id}">
        <div class="theme-h">
          <button class="caret" data-action="toggle-theme" data-id="${th.id}">▼</button>

      </div>`;
    }).join('')}

}

// Les transitions animent seulement ce qui change : rien ne « saute » d'une image à l'autre.
const SITE_COUNT = Array.from({ length: SITE_N + 1 }, (_, k) => k ? siteItems(k).length : 0);

function siteState(D) {
  const s = D >= SITE_N - 1e-9 ? SITE_N : Math.floor(D + 1e-9), f = s >= SITE_N ? 0 : Math.max(0, D - s);
  const on = {};
  for (let k = 1; k <= SITE_N; k++) for (let i = 0; i < SITE_COUNT[k]; i++) {
    const built = Math.floor(f * SITE_COUNT[k] + 1e-9);
    let v;
    if (k === 3) v = s < 3 && (k !== s + 1 || i >= built);
    else if ((k === 1 && s >= 2) || (k === 2 && s >= 6) || (k === 5 && s >= 7)) v = false;
    else v = s >= k || (k === s + 1 && i < built);
    on[`it${k}_${i}`] = v;
  }
  Object.assign(on, {
    bp7: s >= 2 && s < 7, bp9: s >= 2 && s < 9, bp13: s >= 2 && s < 13,
    scaf: s >= 6 && s < 11, scafU: s >= 8 && s < 11, crane: s >= 6 && s < 10, night: s >= SITE_N,
    signA: s <= 1 && !(s === 0 && f > 0), signB: s === 0 && f > 0, signC: s >= 2 && s < SITE_N, signD: s >= SITE_N
  });
  for (let k = 1; k <= SITE_N; k++) on['veh' + k] = (k === s + 1 && f > 0) || (k === SITE_N && s >= SITE_N);
  ['wkH', 'wkP', 'wkG'].forEach(g => { on[g] = f > 0 && s + 1 >= 2 && s + 1 <= 19 && WK_GROUP(s + 1) === g });
  return on;
}

/* --- Animation : on fait évoluer la scène existante de l'avancement affiché vers l'avancement réel --- */
const siteCtl = {};
const qa = (svg, key) => [...svg.querySelectorAll(`[data-sv="${key}"]`)];
const sleep = ms => new Promise(r => setTimeout(r, ms));

function tween(el, from, to, o = {}) {
  if (!el) return Promise.resolve();
  const a = el.animate([from, to], { duration: o.d || 1000, delay: o.delay || 0, easing: o.e || 'ease-out', fill: 'both' });
  return a.finished.then(() => { Object.assign(el.style, to); a.cancel() }, () => {});
}
const SHOW = { drop: { opacity: 0, transform: 'translateY(-46px)' }, rise: { opacity: 0, transform: 'translateY(14px)' }, fade: { opacity: 0 }, vanish: { opacity: 0 } };
const fadeKey = (svg, key, show, d = 1400) => Promise.all(qa(svg, key).map(el => show
  ? tween(el, { opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'translateY(0px)' }, { d })
  : tween(el, { opacity: 1, transform: 'translateY(0px)' }, { opacity: 0, transform: 'translateY(6px)' }, { d })));

// Fait apparaître / disparaître tout ce qui diffère entre deux états (hors éléments d'étape et véhicules)
function morphExtras(svg, a, b, d) {
  return Promise.all(Object.keys(b).filter(k => !k.startsWith('it') && !k.startsWith('veh') && a[k] !== b[k]).map(k => fadeKey(svg, k, b[k], k === 'night' ? 4000 : d)));
}

function drive(svg, k, inOut, d) {
  const el = qa(svg, 'veh' + k)[0];
  if (!el) return Promise.resolve();
  const [from, to] = inOut === 'in' ? ['translateX(1300px)', 'translateX(0px)'] : ['translateX(0px)', 'translateX(-1400px)'];
  el.querySelectorAll('.whl').forEach(w => w.animate([{ transform: 'rotate(0)' }, { transform: `rotate(${inOut === 'in' ? -1500 : -1600}deg)` }], { duration: d, easing: inOut === 'in' ? 'ease-out' : 'ease-in' }));
  return tween(el, { transform: from }, { transform: to }, { d, e: inOut === 'in' ? 'cubic-bezier(.2,.6,.3,1)' : 'cubic-bezier(.6,0,.8,.4)' });
}

// Mouvements de travail du véhicule (et de la grue) pendant une durée donnée
function workMotion(svg, k, d) {
  const v = qa(svg, 'veh' + k)[0], n = Math.max(1, Math.round(d / 3000));
  const A = (el, kf, o) => el && el.animate(kf, { duration: d / n, iterations: n, easing: 'ease-in-out', ...o });
  A(v?.querySelector('.arm'), [{ transform: 'rotate(0)' }, { transform: 'rotate(-22deg)' }, { transform: 'rotate(8deg)' }, { transform: 'rotate(0)' }]);
  A(v?.querySelector('.veh'), [{ transform: 'translateY(0)' }, { transform: 'translateY(-1.5px)' }, { transform: 'translateY(0)' }], { iterations: n * 8, duration: d / (n * 8) });
  if (k >= 7 && k <= 10) {
    A(svg.querySelector('.load'), [{ transform: 'translateY(0)' }, { transform: 'translateY(150px)', offset: .45 }, { transform: 'translateY(150px)', offset: .55 }, { transform: 'translateY(0)' }]);
    A(svg.querySelector('.cable'), [{ transform: 'scaleY(1)' }, { transform: 'scaleY(2.56)', offset: .45 }, { transform: 'scaleY(2.56)', offset: .55 }, { transform: 'scaleY(1)' }]);
  }
  const cargo = v?.querySelector('.cargo');
  if (cargo && SITE_STEPS[k]) cargo.animate([{ opacity: 1 }, { opacity: .25 }], { duration: d, fill: 'forwards' });
}

// Travaux d'une étape k, de l'avancement f0 à f1 (f1 = 1 : étape terminée)
async function workStage(ctl, k, f0, f1, fast) {
  const svg = ctl.svg, n = SITE_COUNT[k], sc = fast ? .55 : 1;
  const D0 = k - 1 + f0, D1 = k - 1 + f1;
  const i0 = Math.floor(f0 * n + 1e-9), i1 = f1 >= 1 - 1e-9 ? n : Math.floor(f1 * n + 1e-9);
  setRun(ctl, k);
  // Le véhicule de l'étape arrive s'il n'est pas déjà sur place
  if (f0 <= 1e-9) {
    await Promise.all([drive(svg, k, 'in', 5000 * sc), morphExtras(svg, siteState(D0), siteState(k - 1 + 1e-6), 1200)]);
    if (ctl.skip) return;
  }
  // Pose des éléments un par un
  const count = i1 - i0;
  if (count > 0) {
    const total = (f1 >= 1 - 1e-9 ? Math.min(16000, Math.max(7000, count * 900)) : Math.min(6000, Math.max(1200, count * 800))) * sc;
    workMotion(svg, k, total);
    const fx = SITE_FX[k], step = total / count;
    await Promise.all(Array.from({ length: count }, (_, j) => {
      const el = qa(svg, `it${k}_${i0 + j}`)[0];
      return fx === 'vanish'
        ? tween(el, { opacity: 1, transform: 'translateY(0px)' }, { opacity: 0, transform: 'translateY(8px)' }, { d: 900, delay: j * step })
        : tween(el, SHOW[fx], { opacity: 1, transform: 'translateY(0px)' }, { d: 1100, delay: j * step, e: 'cubic-bezier(.2,.9,.3,1.15)' });
    }));
    if (ctl.skip) return;
  }
  await morphExtras(svg, siteState(Math.max(D0, k - 1 + 1e-6)), siteState(D1), 1600);
  // Étape terminée : on range le chantier de cette étape et l'engin repart
  if (f1 >= 1 - 1e-9) {
    toast(`Étape terminée : ${SITE_STEPS[k][0]}`, SITE_STEPS[k][1]);
    if (k < SITE_N) { await sleep(600 * sc); await drive(svg, k, 'out', 5000 * sc) }
  }
}

function setRun(ctl, k) {
  const run = ctl.el.querySelector('.site-run');
  run.hidden = !k;
  if (k) run.querySelector('b').textContent = `${SITE_STEPS[k][0]} — ${SITE_STEPS[k][1]}`;
}

function snapSite(ctl) {
  ctl.D = ctl.target;
  ctl.svg.outerHTML = siteSVG(ctl.D, ctl.name);
  ctl.svg = ctl.el.querySelector('.site-scene');
}

async function siteRun(ctl) {
  if (ctl.busy) return;
  ctl.busy = true;
  while (!ctl.skip && ctl.target > ctl.D + 1e-9) {
    const s = Math.floor(ctl.D + 1e-9), k = s + 1, f0 = ctl.D - s;
    const end = Math.min(ctl.target, k);
    await workStage(ctl, k, f0, end - s, ctl.target - ctl.D > 1.2);
    if (ctl.skip) break;
    ctl.D = end; saveShown(ctl);
  }
  if (ctl.skip || ctl.target < ctl.D - 1e-9) { ctl.svg.getAnimations({ subtree: true }).forEach(a => a.cancel()); snapSite(ctl); saveShown(ctl) }
  ctl.busy = false; ctl.skip = false; setRun(ctl, 0);
}
function saveShown(ctl) { const p = project(ctl.pid); if (p) { p.siteShown = ctl.D; save() } }

/* --- Intégration dans la page --- */
// Le chantier ne mesure que les sous-objectifs de « 1. Finaliser le manuscrit »
const siteTask = () => db.tasks.find(t => t.title === '1. Finaliser le manuscrit');
function siteProgress() {
  const t = siteTask();
  const total = t ? t.subgoals.length || 1 : 0;
  const done = !t ? 0 : t.done ? total : t.subgoals.length ? t.subgoals.filter(s => s.done).length : 0;
  const ratio = total ? done / total : 0, D = ratio * SITE_N;
  const stage = ratio >= 1 ? SITE_N : Math.floor(D + 1e-9), frac = stage >= SITE_N ? 0 : Math.max(0, D - stage);
  const need = stage >= SITE_N ? 0 : Math.max(1, Math.ceil((stage + 1) / SITE_N * total - 1e-9) - done);
  return { total, done, ratio, D, stage, frac, need };
}

function siteInfo(pr) {
  const [name, line] = SITE_STEPS[pr.stage], next = SITE_STEPS[pr.stage + 1], pct = Math.round(pr.ratio * 100);
  return `<div class="site-top"><h2>Chantier du manuscrit</h2>${pr.stage ? '<button class="linkbtn" data-action="site-replay">Revoir la dernière étape</button>' : ''}</div>
    <div class="site-stage"><small>Étape ${pr.stage}/${SITE_N}</small>${name} · <span style="font-weight:500">${line}</span></div>
    <div class="site-bar" title="${pct} %"><span style="width:${pct}%"></span></div>
    <div class="site-steps">${SITE_STEPS.slice(1).map((_, i) => `<i class="${i < pr.stage ? 'on' : i === pr.stage ? 'cur' : ''}" style="--f:${Math.round(pr.frac * 100)}%" title="${SITE_STEPS[i + 1][0]}"></i>`).join('')}</div>
    <div class="site-next">${next ? `« 1. Finaliser le manuscrit » : ${pr.done} / ${pr.total} sous-objectifs. Encore <b>${plural(pr.need, 'case')}</b> à cocher pour : <b>${next[0].toLowerCase()}</b>.` : `${pr.total} / ${pr.total} sous-objectifs. Le manuscrit est terminé, la villa aussi !`}</div>`;
}

function attachSite() {
  const slot = app.querySelector('.site-slot'), t = siteTask();
  if (!slot || !t) return;
  const p = project(t.projectId), pr = siteProgress();
  let ctl = siteCtl[p.id];
  if (!ctl) {
    // Premier affichage : la villa est déjà construite jusqu'à l'avancement enregistré (ou réel), sans animation
    const D = Math.min(p.siteShown ?? pr.D, pr.D);
    const el = document.createElement('section');
    el.className = 'site';
    el.innerHTML = `<div class="site-wrap">${siteSVG(D, p.name)}<div class="site-run" hidden><span>Travaux en cours · <b></b></span><button data-action="site-skip">Passer</button></div></div><div class="site-info"></div>`;
    ctl = siteCtl[p.id] = { pid: p.id, el, svg: el.querySelector('.site-scene'), D, target: pr.D, name: p.name, busy: false, skip: false, compact: false, sentinel: document.createElement('div') };
  }
  slot.replaceWith(ctl.sentinel, ctl.el);
  siteLayout();
  ctl.el.querySelector('.site-info').innerHTML = siteInfo(pr);
  ctl.target = pr.D;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { if (ctl.D !== ctl.target) { snapSite(ctl); saveShown(ctl) } return }
  if (ctl.target > ctl.D + 1e-9) siteRun(ctl);
  else if (ctl.target < ctl.D - 1e-9 && !ctl.busy) { snapSite(ctl); saveShown(ctl) }
}

// Taille de la scène : pleine largeur en haut de page, réduite et collée en haut dès qu'on fait défiler
function siteLayout() {
  const ctl = Object.values(siteCtl).find(c => c.el.isConnected);
  if (!ctl) return;
  const top = ctl.sentinel.getBoundingClientRect().top;
  ctl.compact = ctl.compact ? top < -10 : top < -60;
  ctl.el.classList.toggle('compact', ctl.compact);
  const W = ctl.sentinel.offsetWidth, h = ctl.compact ? (W < 560 ? 96 : 140) : W * 440 / 960;
  const wrap = ctl.el.querySelector('.site-wrap');
  wrap.style.height = h + 'px'; wrap.style.width = (ctl.compact ? h * 960 / 440 : W) + 'px';
}
let siteRaf = 0;
const siteLayoutSoon = () => { if (!siteRaf) siteRaf = requestAnimationFrame(() => { siteRaf = 0; siteLayout() }) };
addEventListener('scroll', siteLayoutSoon, { passive: true });
addEventListener('resize', siteLayoutSoon);

function replaySite() {
  const t = siteTask(); if (!t) return;
  const ctl = siteCtl[t.projectId]; if (!ctl || ctl.busy) return;
  const s = Math.floor(ctl.target + 1e-9); if (!s) return;
  // On revient au début de la dernière étape franchie, puis on rejoue la construction
  ctl.D = s - 1; ctl.svg.outerHTML = siteSVG(ctl.D, ctl.name); ctl.svg = ctl.el.querySelector('.site-scene');
  siteRun(ctl);
}

/* ---------- Calendrier de publication ---------- */
// Créneaux à cadence fixe (7 ou 14 jours) à partir de la 1re date de sortie, sur 6 mois.
// Le créneau en cours (sorti il y a moins d'une période) reste affiché.
function calendarSlots(cal) {
  const t0 = today0(), end = new Date(t0); end.setMonth(end.getMonth() + 6);
  const d = parseDate(cal.start), step = cal.cadence;
  while ((t0 - d) / 86400000 >= step) d.setDate(d.getDate() + step);
  const out = [];
  for (; d <= end; d.setDate(d.getDate() + step)) out.push(isoDate(d));
  return out;
}

function renderCalendar(p, tasks) {
  const slots = calendarSlots(p.calendar);
  const sched = tasks.filter(t => t.pub);
  const inSlot = i => sched.filter(t => (i === 0 ? (t.pub < slots[1] && (!t.done || t.pub >= slots[0])) : (t.pub >= slots[i] && (i === slots.length - 1 || t.pub < slots[i + 1]))));
  const filled = slots.filter((_, i) => inSlot(i).length).length;
  const nextIdx = slots.findIndex(x => daysFromToday(x) >= 0);
  const months = [];
  slots.forEach((date, i) => {
    const d = parseDate(date), key = date.slice(0, 7);
    if (months.at(-1)?.key !== key) months.push({ key, label: d.toLocaleDateString('fr-FR', { month: 'long' }), year: d.getFullYear(), slots: [] });
    months.at(-1).slots.push(i);
  });
  return `<section class="cal" style="--c:${p.color}" data-proj="${p.id}">
    <div class="cal-h"><h2>Calendrier de publication</h2>
      <span class="sub">${p.calendar.cadence === 7 ? 'Chaque semaine' : 'Toutes les 2 semaines'} · ${filled} / ${slots.length} créneaux programmés · <button class="linkbtn" data-action="edit-project" data-id="${p.id}">Réglages</button></span></div>
    ${months.map(m => `<div class="cal-month">
      <div class="cal-mlabel">${m.label}${m.year !== today0().getFullYear() ? `<small>${m.year}</small>` : ''}</div>
      <div class="cal-slots">${m.slots.map(i => {
        const date = slots[i], items = inSlot(i), d = parseDate(date), n = daysFromToday(date);
        return `<div class="slot ${items.length ? '' : 'free'} ${n < 0 ? 'past' : ''} ${i === nextIdx ? 'next' : ''}" data-slot="${date}">
          <div class="slot-date"><b>${d.getDate()}</b>${d.toLocaleDateString('fr-FR', { weekday: 'short' })}${i === nextIdx ? '<span class="tag">Prochain</span>' : ''}</div>
          ${items.map(t => miniCard(t, p)).join('')}
          ${items.length ? '' : `<button class="slot-add" data-action="slot-add" data-id="${date}">+ Programmer</button>`}
        </div>`;
      }).join('')}</div>
    </div>`).join('')}
  </section>`;
}

function miniCard(t, p) {
  const th = theme(t.themeId);
  const late = !t.done && daysFromToday(t.pub) < 0;
  return `<article class="card mini ${t.done ? 'done' : ''} ${late ? 'late-pub' : ''}" style="--c:${p.color}" data-task="${t.id}">
    <div class="card-main">
      ${t.done ? '' : '<span class="handle" title="Glisser vers un autre créneau">⋮⋮</span>'}
      <button class="check ${t.done ? 'on' : ''}" data-action="toggle-done" data-id="${t.id}" title="Publié">${t.done ? '✓' : ''}</button>
      <div class="body" data-action="edit-task" data-id="${t.id}">
        <span class="title">${esc(t.title)}</span>
        ${th || late ? `<div class="meta">${late ? `<span style="color:var(--danger);font-weight:600">Prévu ${fmtDate(t.pub)}</span>` : ''}${th ? `<span class="theme-tag">${esc(th.name)}</span>` : ''}</div>` : ''}
      </div>
    </div>
  </article>`;
}

function openSlot(date) {
  dlg.innerHTML = `<form class="modal" data-form="slot" method="dialog">
    <h3>Programmer le ${fmtDate(date)}</h3>
    <input type="hidden" name="date" value="${date}">
    <div class="field"><label for="slot-title">Titre de l'épisode</label><input class="input" id="slot-title" name="title" required autocomplete="off"></div>
    <div class="field"><label for="slot-theme">Thématique</label><select id="slot-theme" name="theme">${themeOptions(ui.project)}</select></div>
    <p class="hint">Tu peux aussi glisser une tâche existante (poignée ⋮⋮) directement dans un créneau.</p>
    <div class="modal-foot"><div class="right"><button class="btn primary">Programmer</button><button type="button" class="btn" data-action="close">Annuler</button></div></div>
  </form>`;
  dlg.showModal();
  dlg.querySelector('#slot-title').focus();
}

function renderView(view) {
  const list = sortTasks(active().filter(t => view === 'urgent' ? t.flagged : view === 'week' ? inWeek(t) : bucket(t) === view));
  if (!list.length) return `<p class="empty">${view === 'urgent' ? 'Aucune tâche urgente. Clique sur le drapeau ⚑ d\'une tâche pour l\'ajouter ici.' : 'Rien ici pour le moment.'}</p>`;
  if (view === 'urgent') {
    // Pas besoin de date : on additionne le travail restant de chaque tâche urgente
    const min = list.reduce((a, t) => a + (t.subgoals.length ? openSubs(t).reduce((b, x) => b + (x.est || 0), 0) : (t.est || 0)), 0);
    return `<section class="week"><h2>Urgent</h2>
      <p class="sub">${plural(list.length, 'tâche')} marquée${list.length > 1 ? 's' : ''} d'un drapeau${min ? `, environ <b>${fmtDur(min)}</b> de travail restant` : ''}.</p>
      <div class="list">${list.map(t => card(t, { showProject: true, showTheme: true })).join('')}</div></section>`;
  }
  if (view !== 'later') {
    const load = weekLoad(list);
    return `<section class="week"><h2>${view === 'today' ? "Aujourd'hui" : 'Cette semaine'}</h2>
      <p class="sub">Environ <b>${fmtDur(load.min) || '0 h'}</b> de travail estimé${load.missing ? `, ${plural(load.missing, 'élément')} sans estimation` : ''}.</p>
      <div class="list">${list.map(t => card(t, { showProject: true, showTheme: true })).join('')}</div></section>`;
  }
  return db.projects.map(p => {
    const l = list.filter(t => t.projectId === p.id);
    return l.length ? `<div class="group-title"><span class="dot" style="background:${p.color}"></span>${esc(p.name)} <span class="n" style="color:var(--muted);font-weight:500">${l.length}</span></div>
      <div class="list">${l.map(t => card(t, { showTheme: true })).join('')}</div>` : '';
  }).join('');
}

function card(t, { showTheme, showProject } = {}) {
  const p = project(t.projectId) || { color: '#999', name: '?' };
  const th = theme(t.themeId);
  const doneSubs = t.subgoals.filter(s => s.done).length;
  const est = totalEst(t);
  const nsd = nextSubDeadline(t);
  const meta = [];
  if (showProject) meta.push(`<span class="proj-tag" style="color:${p.color}">${esc(p.name)}</span>`);
  if (t.subgoals.length) meta.push(`<span>${doneSubs}/${t.subgoals.length} sous-objectifs${est ? `, environ ${fmtDur(est)}` : ''}</span>`);
  else if (est) meta.push(`<span>environ ${fmtDur(est)}</span>`);
  if (t.pub) meta.push(`<span ${!t.done && daysFromToday(t.pub) < 0 ? 'style="color:var(--danger);font-weight:600"' : ''}>Sortie : ${fmtDate(t.pub)}</span>`);
  if (nsd) meta.push(`<span ${daysFromToday(nsd) < 0 ? 'style="color:var(--danger);font-weight:600"' : ''}>Prochaine échéance : ${fmtDate(nsd)}</span>`);
  if (showTheme && th) meta.push(`<span class="theme-tag">${esc(th.name)}</span>`);
  const isOpen = ui.open[t.id];

  return `<article class="card ${t.flagged && !t.done ? 'flag' : ''} ${t.done ? 'done' : ''}" style="--c:${p.color}" data-task="${t.id}">
    <div class="card-main">
      ${t.done ? '' : '<span class="handle" title="Glisser pour déplacer">⋮⋮</span>'}
      <button class="check ${t.done ? 'on' : ''}" data-action="toggle-done" data-id="${t.id}" title="Terminer">${t.done ? '✓' : ''}</button>
      <div class="body" data-action="expand" data-id="${t.id}">
        <div class="title-row"><span class="title">${esc(t.title)}</span>${t.due ? `<span class="pill ${daysFromToday(t.due) < 0 && !t.done ? 'late' : ''}">${fmtDate(t.due)}</span>` : ''}</div>
        ${meta.length ? `<div class="meta">${meta.join('')}</div>` : ''}
      </div>
      <div class="actions">
      <button class="icon" data-action="edit-task" data-id="${t.id}" title="Modifier">✎</button>
      <button class="icon flagbtn ${t.flagged ? 'on' : ''}" data-action="flag" data-id="${t.id}" title="Priorité">⚑</button>
      </div>
    </div>
    ${isOpen && t.subgoals.length ? `<div class="subs">${t.subgoals.map(s => `
      <div class="subrow ${s.done ? 'done' : ''}">
        <button class="check ${s.done ? 'on' : ''}" data-action="toggle-sub" data-id="${t.id}" data-sub="${s.id}">${s.done ? '✓' : ''}</button>
        <span class="t">${esc(s.title)}</span>
        ${s.due ? `<span class="m ${!s.done && daysFromToday(s.due) < 0 ? 'late' : ''}">${fmtDate(s.due)}</span>` : ''}
        ${s.est ? `<span class="m">${fmtDur(s.est)}</span>` : ''}
      </div>`).join('')}</div>` : ''}
  </article>`;
}

function readDraft() {

  draft.projectId = f.projectId.value;
  draft.themeId = f.themeId.value || null;

  if (!f.est.disabled) draft.est = parseDur(f.est.value);
  draft.flagged = f.flagged.checked;
  f.querySelectorAll('.sub-edit').forEach(row => {
    const s = draft.subgoals.find(x => x.id === row.dataset.sub);

    s.done = v('done').checked; s.title = v('title').value.trim();
    s.due = v('due').value || null; s.est = parseDur(v('est').value);
  });
}

/* ---------- Actions ---------- */
const findTask = id => db.tasks.find(t => t.id === id);
function commit() { save(); render() }

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action, id } = el.dataset;
  const t = id && findTask(id);
  switch (action) {
    case 'view': ui.view = ui.view === id ? null : id; return commit();
    case 'project': ui.project = id; ui.view = null; ui.editObjective = false; return commit();
    case 'new-project': return openProject(null);
    case 'edit-project': return openProject(id);
    case 'edit-objective': ui.editObjective = true; render(); app.querySelector('textarea')?.focus(); return;
    case 'cancel-objective': ui.editObjective = false; return render();
    case 'toggle-done': t.done = !t.done; t.doneAt = t.done ? Date.now() : null; return commit();
    case 'flag': t.flagged = !t.flagged; return commit();
    case 'expand': ui.open[id] = !ui.open[id]; return commit();
    case 'toggle-sub': { const s = t.subgoals.find(x => x.id === el.dataset.sub); s.done = !s.done; return commit() }
    case 'edit-task': return openTask(id);
    case 'toggle-theme': { const th = theme(id); th.collapsed = !th.collapsed; return commit() }
    case 'rename-theme': { const th = theme(id); const n = await ask('Nouveau nom de la thématique', { input: th.name, ok: 'Renommer' }); if (n && n.trim()) { th.name = n.trim(); commit() } return }
    case 'delete-theme': {
      const th = theme(id);
      if (!await ask(`Supprimer la thématique « ${th.name} » ? Ses tâches passeront dans « Sans thématique ».`, { ok: 'Supprimer', danger: true })) return;
      db.tasks.forEach(x => { if (x.themeId === id) x.themeId = null });
      db.themes = db.themes.filter(x => x.id !== id);
      return commit();
    }
    // Modale tâche
    case 'add-sub': readDraft(); draft.subgoals.push({ id: uid(), title: '', due: null, est: 0, done: false }); renderTaskModal(); dlg.querySelector('.sub-edit:last-of-type [data-f="title"]')?.focus(); return;
    case 'del-sub': readDraft(); draft.subgoals = draft.subgoals.filter(s => s.id !== el.dataset.sub); return renderTaskModal();
    case 'delete-task':
      if (!await ask('Supprimer cette tâche ?', { ok: 'Supprimer', danger: true })) return;
      db.tasks = db.tasks.filter(x => x.id !== draft.id); dlg.close(); return commit();
    // Modale projet
    case 'move-project': {
      const i = db.projects.findIndex(x => x.id === projDraft.id), j = i + Number(id);
      [db.projects[i], db.projects[j]] = [db.projects[j], db.projects[i]];
      readProjDraft();
      save(); render(); return renderProjectModal();
    }
    case 'color': readProjDraft(); projDraft.color = id; return renderProjectModal();
    case 'slot-add': return openSlot(id);
    case 'site-skip': { const c = Object.values(siteCtl).find(c => c.busy); if (c) { c.skip = true; c.svg.getAnimations({ subtree: true }).forEach(a => a.cancel()) } return }
    case 'site-replay': return replaySite();
    case 'delete-project': {
      const n = db.tasks.filter(x => x.projectId === projDraft.id).length;
      if (!await ask(`Supprimer « ${projDraft.name} » et ses ${n} tâche(s) ? C'est définitif.`, { ok: 'Supprimer', danger: true })) return;
      db.tasks = db.tasks.filter(x => x.projectId !== projDraft.id);
      db.themes = db.themes.filter(x => x.projectId !== projDraft.id);
      db.projects = db.projects.filter(x => x.id !== projDraft.id);
      ui.project = db.projects[0]?.id || null; dlg.close(); return commit();
    }
    case 'close': return dlg.close();
    case 'export': {
      const json = JSON.stringify(db);
      if (!await ask('Voici ta sauvegarde. Copie-la et garde-la dans une note ou un fichier.', { input: json, area: true, ok: 'Copier' })) return;
      try { await navigator.clipboard.writeText(json); await ask('Sauvegarde copiée.', { ok: 'OK', cancel: false }) }
      catch { await ask('Copie automatique impossible : sélectionne le texte et copie-le à la main.', { input: json, area: true, ok: 'Fermer', cancel: false }) }
      return;
    }
    case 'import': {
      const txt = await ask('Colle ici une sauvegarde. Elle remplacera toutes les données actuelles.', { input: '', area: true, ok: 'Importer', danger: true });
      if (!txt) return;
      try {
        const data = JSON.parse(txt);
        if (!Array.isArray(data.projects) || !Array.isArray(data.tasks)) throw new Error();
        db = { v: 2, livreChapitres: data.livreChapitres, livreMeditations: data.livreMeditations, livreIllustrations: data.livreIllustrations, livreVincent: data.livreVincent, livreMassages: data.livreMassages, livreRenumerotation: data.livreRenumerotation, livreChapitre21: data.livreChapitre21, livreChapitresManquants: data.livreChapitresManquants, livrePlancheCentres: data.livrePlancheCentres, livreMeditation7: data.livreMeditation7, livreCarnetPdf: data.livreCarnetPdf, livreMeditations15: data.livreMeditations15, leadQuestionnaire: data.leadQuestionnaire, livreSerpents: data.livreSerpents, livreCorpsSubtils: data.livreCorpsSubtils, livreFusion24: data.livreFusion24, livreAnnexesImages: data.livreAnnexesImages, livreAnnexesBis: data.livreAnnexesBis, livreMouvements: data.livreMouvements, projects: data.projects, themes: data.themes || [], tasks: data.tasks };
        ui.project = db.projects[0]?.id || null; ui.view = null; commit();
      } catch { ask("Ce texte n'est pas une sauvegarde valide. Utilise le texte complet donné par « Exporter ».", { ok: 'OK', cancel: false }) }
      return;
    }
  }
});

document.addEventListener('change', e => {
  const k = e.target.dataset.change;
  if (k === 'quick-project') e.target.form.theme.innerHTML = themeOptions(e.target.value);
  if (k === 'draft-project') { readDraft(); draft.themeId = null; renderTaskModal() }
});

document.addEventListener('submit', e => {
  const f = e.target, kind = f.dataset.form;
  if (!kind) return;
  e.preventDefault();
  if (kind === 'quick') {
    const title = f.title.value.trim();
    if (!title) return f.title.focus();
    db.tasks.push({ id: uid(), projectId: f.project.value, themeId: f.theme.value || null, title, due: null, flagged: false, done: false, est: 0, subgoals: [], createdAt: Date.now() });
    ui.project = f.project.value; ui.view = null;
    const keepTheme = f.theme.value;
    commit();
    const nf = app.querySelector('[data-form=quick]'); nf.theme.value = keepTheme; nf.title.focus();
  }
  if (kind === 'theme') {
    const name = f.name.value.trim();
    if (!name) return;
    db.themes.push({ id: uid(), projectId: ui.project, name, collapsed: false });
    commit();
  }
  if (kind === 'objective') {
    project(ui.project).objective = f.objective.value.trim();
    ui.editObjective = false; commit();
  }
  if (kind === 'task') {
    readDraft();
    draft.subgoals = draft.subgoals.filter(s => s.title);
    const i = db.tasks.findIndex(x => x.id === draft.id);
    db.tasks[i] = draft; dlg.close(); commit();
  }
  if (kind === 'slot') {
    const title = f.title.value.trim();
    if (!title) return;
    db.tasks.push({ id: uid(), projectId: ui.project, themeId: f.theme.value || null, title, due: null, pub: f.date.value, flagged: false, done: false, est: 0, subgoals: [], createdAt: Date.now() });
    dlg.close(); return commit();
  }
  if (kind === 'project') {
    readProjDraft();
    if (!projDraft.name) return;
    if (projDraft.id) Object.assign(project(projDraft.id), projDraft);
    else { projDraft.id = uid(); db.projects.push(projDraft); ui.project = projDraft.id; ui.view = null }
    dlg.close(); commit();
  }
});

/* ---------- Glisser-déposer ---------- */
// Tâches : poignée ⋮⋮ (souris et tactile), dépôt dans une thématique, un créneau du calendrier ou sur un projet.
// Projets : glisser les pastilles à la souris pour changer leur ordre.
let drag = null;
const dropLine = Object.assign(document.createElement('div'), { className: 'drop-line' });
const chipLine = Object.assign(document.createElement('span'), { className: 'chip-line' });

document.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const h = e.target.closest('.handle');
  const chip = !h && e.pointerType === 'mouse' && e.target.closest('[data-chip]');
  if (!h && !chip) return;
  const el = h ? h.closest('.card') : chip;
  const r = el.getBoundingClientRect();
  drag = { kind: h ? 'task' : 'chip', el, id: h ? el.dataset.task : chip.dataset.chip, x0: e.clientX, y0: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top, w: r.width, started: false, target: null };
  if (h) { e.preventDefault(); startDrag() }
});

function startDrag() {
  drag.started = true;
  drag.ghost = drag.el.cloneNode(true);
  drag.ghost.classList.add(drag.kind === 'task' ? 'ghost' : 'chip-ghost');
  drag.ghost.style.width = drag.w + 'px';
  document.body.appendChild(drag.ghost);
  drag.el.classList.add('drag-src');
  document.body.classList.add('dragging');
}

function clearMarks() {
  document.querySelectorAll('.drop-over').forEach(x => x.classList.remove('drop-over'));
  dropLine.remove(); chipLine.remove();
}

document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.started) { if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return; startDrag() }
  e.preventDefault();
  drag.ghost.style.left = e.clientX - drag.dx + 'px';
  drag.ghost.style.top = e.clientY - drag.dy + 'px';
  if (e.clientY < 60) scrollBy(0, -12); else if (e.clientY > innerHeight - 60) scrollBy(0, 12);
  clearMarks();
  const under = document.elementFromPoint(e.clientX, e.clientY);
  drag.target = null;
  if (!under) return;

  if (drag.kind === 'chip') {
    const row = document.querySelector('.chips');
    const chips = [...row.querySelectorAll('[data-chip]')].filter(c => c !== drag.el);
    if (!under.closest('.chips')) return;
    const before = chips.find(c => { const r = c.getBoundingClientRect(); return e.clientX < r.left + r.width / 2 });
    row.insertBefore(chipLine, before || row.querySelector('.chip.add'));
    drag.target = { before: before?.dataset.chip || null };
    return;
  }

  const chip = under.closest('[data-chip]');
  if (chip) { chip.classList.add('drop-over'); drag.target = { project: chip.dataset.chip }; return }
  const slot = under.closest('[data-slot]');
  if (slot) { slot.classList.add('drop-over'); drag.target = { slot: slot.dataset.slot, project: slot.closest('[data-proj]').dataset.proj }; return }
  const th = under.closest('[data-drop]');
  if (!th) return;
  th.classList.add('drop-over');
  const list = th.querySelector('.list');
  const cards = [...list.querySelectorAll(':scope > .card')].filter(c => c !== drag.el);
  const before = th.classList.contains('closed') ? null : cards.find(c => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height / 2 });
  if (!th.classList.contains('closed')) list.insertBefore(dropLine, before || null);
  drag.target = { theme: th.dataset.drop, list: cards.map(c => c.dataset.task), before: before?.dataset.task || null };
}, { passive: false });

function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.started) return;
  d.ghost.remove(); d.el.classList.remove('drag-src'); document.body.classList.remove('dragging'); clearMarks();
  // Empêche le clic qui suit le relâchement (sélection de projet, ouverture de carte)
  const swallow = ev => { ev.stopPropagation(); ev.preventDefault() };
  addEventListener('click', swallow, { capture: true, once: true });
  setTimeout(() => removeEventListener('click', swallow, true), 0);
  const t = d.target;
  if (e.type === 'pointercancel' || !t) return render();

  if (d.kind === 'chip') {
    const moved = db.projects.find(p => p.id === d.id);
    db.projects = db.projects.filter(p => p !== moved);
    const i = t.before ? db.projects.findIndex(p => p.id === t.before) : db.projects.length;
    db.projects.splice(i, 0, moved);
    return commit();
  }
  const task = findTask(d.id);
  if (t.project) {
    if (task.projectId !== t.project) { task.projectId = t.project; task.themeId = null; task.order = undefined }
    if (t.slot) task.pub = t.slot;
    return commit();
  }
  // Remettre une tâche dans une thématique la retire du calendrier
  task.pub = null;
  task.themeId = t.theme || null;
  const ids = t.list.slice();
  ids.splice(t.before ? ids.indexOf(t.before) : ids.length, 0, task.id);
  ids.forEach((id, i) => { findTask(id).order = i });
  commit();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

// Fermer la modale en cliquant hors du cadre
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close() });

render();
</script>
</body>
</html>
