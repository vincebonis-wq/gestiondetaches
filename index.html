<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes projets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0ec; --card:#fff; --ink:#1c2526; --muted:#5f6b68; --line:#d9ddd8;
  --soft:#e2e7e3; --primary:#2f5e4e; --primary-ink:#fff; --danger:#c8323c;
  --danger-bg:#fbe3e6; --danger-line:#d97b84; --pill:#e4e8e5; --pill-ink:#4c5654;
  --warn:#c9952b; --warn-bg:#fbf7ee; --field:#f6f7f5; --check:#c9cfcc; --faint:#cfd4d2;
  --chip-on:#1c2526; --chip-on-ink:#fff; --chip-on-muted:#aab3b1; --hover:rgba(0,0,0,.05);
  --backdrop:rgba(20,30,28,.45); --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a19; --card:#1d2523; --ink:#e7ecea; --muted:#9aa7a3; --line:#2f3a37;
  --soft:#222c2a; --primary:#5aa58a; --primary-ink:#0f1614; --danger:#ec6b74;
  --danger-bg:#3a2226; --danger-line:#8a3d45; --pill:#2c3633; --pill-ink:#c4cecb;
  --warn:#d9a640; --warn-bg:#2c2618; --field:#182020; --check:#4a5653; --faint:#46524f;
  --chip-on:#e7ecea; --chip-on-ink:#141a19; --chip-on-muted:#5f6b68; --hover:rgba(255,255,255,.07);
  --backdrop:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a19; --card:#1d2523; --ink:#e7ecea; --muted:#9aa7a3; --line:#2f3a37;
  --soft:#222c2a; --primary:#5aa58a; --primary-ink:#0f1614; --danger:#ec6b74;
  --danger-bg:#3a2226; --danger-line:#8a3d45; --pill:#2c3633; --pill-ink:#c4cecb;
  --warn:#d9a640; --warn-bg:#2c2618; --field:#182020; --check:#4a5653; --faint:#46524f;
  --chip-on:#e7ecea; --chip-on-ink:#141a19; --chip-on-muted:#5f6b68; --hover:rgba(255,255,255,.07);
  --backdrop:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Instrument Sans",system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.wrap{max-width:940px;margin:0 auto;padding:40px 16px 80px}
h1{font-size:clamp(40px,7vw,64px);line-height:1;margin:0 0 14px;letter-spacing:-.03em}
.summary{color:var(--muted);margin:0 0 28px;font-size:18px}
.summary b{color:var(--ink)}

/* Quick add */
.quick{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 20px;margin-bottom:28px}
.quick input[type=text]{width:100%;border:0;border-bottom:1px solid var(--line);padding:6px 2px 16px;font-size:20px;outline:none;background:transparent}
.quick-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
select,.input{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:17px;min-width:0}
.quick-row select{flex:0 1 240px}
.quick-row .grow{flex:1}
.btn{border-radius:8px;padding:10px 20px;font-weight:600;font-size:17px;border:1px solid var(--line);background:var(--card)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.danger{color:var(--danger);border-color:var(--danger-line)}
.btn.small{padding:6px 12px;font-size:15px}

/* Tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tab{background:transparent;border:1px solid var(--line);border-radius:10px;padding:12px 8px;font-weight:600;font-size:18px;text-align:center}
.tab .n{color:var(--muted);font-weight:500;margin-left:6px;font-size:16px}
.tab.active{border-color:var(--warn);background:var(--warn-bg)}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;scrollbar-width:thin}
.chip{flex:none;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:500;font-size:18px;white-space:nowrap}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip .n{color:var(--muted);font-size:16px}
.chip.active{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chip.active .n{color:var(--chip-on-muted)}
.chip.add{color:var(--muted);border-style:dashed}

/* Objective */
.objective{border-left:4px solid var(--c,var(--primary));padding:4px 0 4px 20px;margin-bottom:28px}
.objective small{color:var(--muted);font-size:15px;display:block;margin-bottom:4px}
.objective .link{color:var(--primary);font-weight:600;font-size:19px;text-decoration:underline;text-underline-offset:4px}
.objective .text{font-size:19px;font-weight:600}
.objective textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:17px}
.proj-tools{display:flex;justify-content:flex-end;gap:8px;margin:-12px 0 12px}
.linkbtn{color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* Sections */
.week{background:var(--soft);border-radius:var(--radius);padding:22px 18px 18px;margin-bottom:40px}
.week h2{margin:0 0 6px;font-size:24px}
.week .sub{color:var(--muted);margin:0 0 14px;font-size:17px}
.week .sub b{color:var(--ink)}
h2.section{font-size:26px;margin:0 0 14px;display:flex;align-items:baseline;gap:10px}
h2.section .n,.theme-h .n{color:var(--muted);font-weight:500;font-size:18px}
.theme{margin-bottom:22px}
.theme-h{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:10px}
.theme-h .name{font-weight:600;font-size:20px}
.theme-h .caret{font-size:11px;color:var(--muted);width:16px;transition:transform .15s}
.theme.closed .caret{transform:rotate(-90deg)}
.theme.closed .list{display:none}
.icon{color:var(--muted);font-size:17px;padding:2px 4px;border-radius:4px;line-height:1}
.icon:hover{color:var(--ink);background:var(--hover)}
.add-theme{display:flex;gap:10px;margin-top:10px}
.add-theme input{flex:1;border:1px dashed var(--check);background:transparent;border-radius:8px;padding:12px 14px}
.empty{color:var(--muted);font-style:italic;padding:6px 2px}

/* Cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:14px 64px 14px 16px;position:relative}
.card.flag{background:var(--danger-bg);border-color:var(--danger-line);border-left-color:var(--danger)}
.card.done .title{text-decoration:line-through;color:var(--muted)}
.card-main{display:flex;gap:14px;align-items:flex-start}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--check);background:var(--card);margin-top:1px;display:grid;place-items:center;color:var(--primary-ink);font-size:14px}
.check:hover{border-color:var(--primary)}
.check.on{background:var(--primary);border-color:var(--primary)}
.body{flex:1;min-width:0;cursor:pointer}
.title{font-size:19px;font-weight:500;display:inline;margin-right:8px}
.pill{display:inline-block;background:var(--pill);color:var(--pill-ink);font-weight:600;font-size:15px;border-radius:999px;padding:2px 12px;vertical-align:2px}
.pill.late{background:var(--danger);color:var(--card)}
.meta{color:var(--muted);font-size:15.5px;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px}
.meta .theme-tag{color:var(--primary);font-weight:600}
.meta .proj-tag{font-weight:600}
.actions{position:absolute;top:12px;right:12px;display:flex;gap:6px}
.flagbtn{color:var(--faint)}
.flagbtn.on{color:var(--danger)}
.subs{margin:12px 0 2px 40px;display:flex;flex-direction:column;gap:6px}
.subrow{display:flex;align-items:center;gap:10px;font-size:16px}
.subrow .check{width:20px;height:20px;font-size:11px}
.subrow.done span.t{text-decoration:line-through;color:var(--muted)}
.subrow .m{color:var(--muted);font-size:14px}
.subrow .m.late{color:var(--danger);font-weight:600}
.group-title{font-weight:600;font-size:18px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.group-title .dot{width:10px;height:10px;border-radius:50%}
details.done-sec summary{cursor:pointer;color:var(--muted);font-weight:600;margin:30px 0 10px}
.footer{margin-top:60px;display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}

/* Modal */
dialog{border:0;border-radius:16px;padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 40px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:var(--backdrop)}
.modal{padding:22px}
.modal h3{margin:0 0 16px;font-size:22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:14px;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check-line{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sub-edit{display:grid;grid-template-columns:22px 1fr 150px 90px 28px;gap:8px;align-items:center;margin-bottom:8px}
.sub-edit .input{padding:8px 10px;font-size:15px}
.sub-head{display:grid;grid-template-columns:22px 1fr 150px 90px 28px;gap:8px;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.modal-foot{display:flex;gap:10px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
.modal-foot .right{display:flex;flex-direction:row-reverse;gap:10px;margin-left:auto}
.ask-area{width:100%;min-height:160px;font:13px/1.4 ui-monospace,Menlo,monospace}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--ink)}
.hint{color:var(--muted);font-size:13px;margin-top:-6px;margin-bottom:12px}

@media (max-width:640px){
  .tabs{grid-template-columns:1fr}
  .quick-row select{flex:1 1 45%}
  .sub-edit,.sub-head{grid-template-columns:22px 1fr 28px}
  .sub-edit .d,.sub-edit .e{grid-column:2}
  .sub-head span:nth-child(n+3){display:none}
  .grid2{grid-template-columns:1fr}
  .card{padding-right:56px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="dlg"></dialog>
<dialog id="ask"></dialog>

<script>
/* ---------- Données ---------- */
const KEY = 'gestiondetaches.v1';
const PALETTE = ['#2f6b4f','#c8323c','#3b55b5','#9b4dbb','#d08a1e','#2a8a9a','#6b6b6b','#b5487a'];
const uid = () => Math.random().toString(36).slice(2, 10);

function seed() {
  const p = (name, color) => ({ id: uid(), name, color, objective: '' });
  const projects = [p('Clients actuels', PALETTE[0]), p('Offre high ticket', PALETTE[1]), p('Le studio', PALETTE[2]), p('Meeting Mouvement', PALETTE[3])];
  const studio = projects[2].id;
  const th = name => ({ id: uid(), projectId: studio, name, collapsed: false });
  const themes = [th('Location pour création de contenu'), th('Loyers récurrents'), th('Gestion du studio')];
  const t = (title, themeId, extra = {}) => ({ id: uid(), projectId: studio, themeId, title, due: null, flagged: false, done: false, est: 0, subgoals: [], createdAt: Date.now(), ...extra });
  const tasks = [
    t('Gérer les travaux au studio', themes[2].id, { flagged: true }),
    t('Renégocier le loyer de Gabriel', themes[1].id),
    t('Offre de shooting vidéo PREMIUM avec vidéaste pro', themes[0].id),
    t('Offre de shooting photo PREMIUM avec Sarah', themes[0].id),
    t('Proposer le studio à des coachs pour créer du contenu', themes[0].id),
    t('Proposer le studio à louer à des profs de Yoga / Pilates / autres', themes[1].id),
    t('Renégocier le loyer de Clara', themes[1].id),
    t('Société de ménage récurrente', themes[2].id),
  ];
  return { projects, themes, tasks };
}

let db;
try { db = JSON.parse(localStorage.getItem(KEY)) } catch (e) { db = null }
if (!db || !db.projects) db = seed();
let ui = { project: db.projects[0]?.id || null, view: null, open: {}, editObjective: false };
try { Object.assign(ui, JSON.parse(localStorage.getItem(KEY + '.ui')) || {}, { editObjective: false }) } catch (e) {}
if (!db.projects.some(p => p.id === ui.project)) ui.project = db.projects[0]?.id || null;

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); localStorage.setItem(KEY + '.ui', JSON.stringify({ project: ui.project, view: ui.view, open: ui.open })) } catch (e) {}
}

/* ---------- Dates & durées ---------- */
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d };
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d) };
const daysFromToday = s => Math.round((parseDate(s) - today0()) / 86400000);
const fmtDate = s => parseDate(s).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
function fmtDur(m) {
  if (!m) return '';
  const h = Math.floor(m / 60), r = m % 60;
  if (!h) return r + ' min';
  return r ? `${h} h ${String(r).padStart(2, '0')}` : `${h} h`;
}
function parseDur(s) {
  s = String(s || '').trim().toLowerCase().replace(',', '.');
  if (!s) return 0;
  let m = s.match(/^(\d+(?:\.\d+)?)\s*h\s*(\d+)?\s*(?:min)?$/);
  if (m) return Math.round(parseFloat(m[1]) * 60) + (+m[2] || 0);
  m = s.match(/^(\d+)\s*(?:min|mn|m)?$/);
  return m ? +m[1] : 0;
}

/* ---------- Logique tâches ---------- */
const openSubs = t => t.subgoals.filter(s => !s.done);
const nextSubDeadline = t => openSubs(t).map(s => s.due).filter(Boolean).sort()[0] || null;
const nextDeadline = t => [t.due, nextSubDeadline(t)].filter(Boolean).sort()[0] || null;
const totalEst = t => t.subgoals.length ? t.subgoals.reduce((a, s) => a + (s.est || 0), 0) : (t.est || 0);
function bucket(t) {
  const d = nextDeadline(t);
  if (d) { const n = daysFromToday(d); if (n <= 0) return 'today'; if (n < 7) return 'week' }
  return 'later';
}
const inWeek = t => bucket(t) !== 'later';
const active = () => db.tasks.filter(t => !t.done);
const project = id => db.projects.find(p => p.id === id);
const theme = id => db.themes.find(t => t.id === id);
const projThemes = pid => db.themes.filter(t => t.projectId === pid);

// Travail des 7 prochains jours : sous-objectifs (ou tâche sans sous-objectif) dont l'échéance tombe dans la semaine
function weekLoad(tasks) {
  let min = 0, missing = 0;
  for (const t of tasks) {
    const items = t.subgoals.length ? openSubs(t).filter(s => s.due && daysFromToday(s.due) < 7) : (t.due && daysFromToday(t.due) < 7 ? [t] : []);
    for (const i of items) { if (i.est) min += i.est; else missing++ }
  }
  return { min, missing };
}

/* ---------- Rendu ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, s, p) => `${n} ${n > 1 ? (p || s + 's') : s}`;
const app = document.getElementById('app');

function render() {
  const act = active();
  const counts = { today: 0, week: 0, later: 0 };
  act.forEach(t => { const b = bucket(t); counts[b]++; if (b === 'today') counts.week++ });
  const flagged = act.filter(t => t.flagged).length;
  const cur = project(ui.project);

  app.innerHTML = `
    <h1>Mes projets</h1>
    <p class="summary"><b>${plural(flagged, 'priorité')}</b> cette semaine, ${plural(counts.later, 'idée')} en attente.</p>

    <form class="quick" data-form="quick">
      <input type="text" name="title" placeholder="Note une idée ou une tâche…" autocomplete="off">
      <div class="quick-row">
        <select name="project" data-change="quick-project">${db.projects.map(p => `<option value="${p.id}" ${p.id === ui.project ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
        <select name="theme">${themeOptions(ui.project)}</select>
        <span class="grow"></span>
        <button class="btn primary" type="submit">Ajouter</button>
      </div>
    </form>

    <div class="tabs">
      ${[['today', "À faire aujourd'hui"], ['week', 'À faire cette semaine'], ['later', 'À anticiper']].map(([k, l]) =>
        `<button class="tab ${ui.view === k ? 'active' : ''}" data-action="view" data-id="${k}">${l}<span class="n">${counts[k]}</span></button>`).join('')}
    </div>

    <div class="chips">
      ${db.projects.map(p => `<button class="chip ${!ui.view && p.id === ui.project ? 'active' : ''}" data-action="project" data-id="${p.id}">
        <span class="dot" style="background:${p.color}"></span>${esc(p.name)}<span class="n">${act.filter(t => t.projectId === p.id).length}</span></button>`).join('')}
      <button class="chip add" data-action="new-project">+ Projet</button>
    </div>

    ${ui.view ? renderView(ui.view) : cur ? renderProject(cur) : '<p class="empty">Crée ton premier projet avec « + Projet ».</p>'}

    <div class="footer">
      <button class="linkbtn" data-action="export">Exporter (sauvegarde)</button>
      <button class="linkbtn" data-action="import">Importer</button>
    </div>`;
}

function themeOptions(pid, selected) {
  return `<option value="">Sans thématique</option>` + projThemes(pid).map(t => `<option value="${t.id}" ${t.id === selected ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
}

function sortTasks(list) {
  return list.sort((a, b) => (b.flagged - a.flagged) || ((nextDeadline(a) || '9999') < (nextDeadline(b) || '9999') ? -1 : (nextDeadline(a) || '9999') > (nextDeadline(b) || '9999') ? 1 : a.createdAt - b.createdAt));
}

function renderProject(p) {
  const tasks = db.tasks.filter(t => t.projectId === p.id);
  const open = tasks.filter(t => !t.done);
  const week = sortTasks(open.filter(t => inWeek(t) || t.flagged));
  const waiting = open.filter(t => !week.includes(t));
  const done = tasks.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const load = weekLoad(week);
  const themes = projThemes(p.id);
  const noTheme = waiting.filter(t => !t.themeId || !theme(t.themeId));

  const objective = ui.editObjective
    ? `<form data-form="objective"><textarea name="objective" placeholder="Où veux-tu en être dans 90 jours ?">${esc(p.objective)}</textarea>
       <div style="display:flex;gap:8px;margin-top:8px"><button class="btn small primary">Enregistrer</button><button type="button" class="btn small" data-action="cancel-objective">Annuler</button></div></form>`
    : p.objective
      ? `<div class="text">${esc(p.objective)} <button class="icon" data-action="edit-objective" title="Modifier">✎</button></div>`
      : `<button class="link" data-action="edit-objective">Fixer l'objectif de ce projet</button>`;

  return `
    <div class="proj-tools"><button class="linkbtn" data-action="edit-project" data-id="${p.id}">Modifier le projet</button></div>
    <div class="objective" style="--c:${p.color}"><small>Objectif à 90 jours</small>${objective}</div>

    <section class="week">
      <h2>Cette semaine</h2>
      ${week.length ? `<p class="sub">Environ <b>${fmtDur(load.min) || '0 h'}</b> de travail estimé sur 7 jours${load.missing ? `, ${plural(load.missing, 'élément')} sans estimation` : ''}.</p>
        <div class="list">${week.map(t => card(t, { showTheme: true })).join('')}</div>`
        : `<p class="sub">Rien de prévu dans les 7 prochains jours.</p>`}
    </section>

    <h2 class="section">En attente <span class="n">${waiting.length}</span></h2>
    ${themes.map(th => {
      const list = sortTasks(waiting.filter(t => t.themeId === th.id));
      return `<div class="theme ${th.collapsed ? 'closed' : ''}">
        <div class="theme-h">
          <button class="caret" data-action="toggle-theme" data-id="${th.id}">▼</button>
          <span class="name" data-action="toggle-theme" data-id="${th.id}" style="cursor:pointer">${esc(th.name)}</span><span class="n">${list.length}</span>
          <button class="icon" data-action="rename-theme" data-id="${th.id}" title="Renommer">✎</button>
          <button class="icon" data-action="delete-theme" data-id="${th.id}" title="Supprimer">×</button>
        </div>
        <div class="list">${list.length ? list.map(t => card(t)).join('') : '<div class="empty">Aucune tâche en attente.</div>'}</div>
      </div>`;
    }).join('')}
    ${noTheme.length ? `<div class="theme"><div class="theme-h"><span class="caret"></span><span class="name">Sans thématique</span><span class="n">${noTheme.length}</span></div>
      <div class="list">${sortTasks(noTheme).map(t => card(t)).join('')}</div></div>` : ''}

    <form class="add-theme" data-form="theme">
      <input name="name" placeholder="Nouvelle thématique…" autocomplete="off">
      <button class="btn">Ajouter la thématique</button>
    </form>

    ${done.length ? `<details class="done-sec"><summary>Terminées (${done.length})</summary><div class="list">${done.map(t => card(t, { showTheme: true })).join('')}</div></details>` : ''}`;
}

function renderView(view) {
  const list = sortTasks(active().filter(t => view === 'week' ? inWeek(t) : bucket(t) === view));
  if (!list.length) return `<p class="empty">Rien ici pour le moment.</p>`;
  if (view !== 'later') {
    const load = weekLoad(list);
    return `<section class="week"><h2>${view === 'today' ? "Aujourd'hui" : 'Cette semaine'}</h2>
      <p class="sub">Environ <b>${fmtDur(load.min) || '0 h'}</b> de travail estimé${load.missing ? `, ${plural(load.missing, 'élément')} sans estimation` : ''}.</p>
      <div class="list">${list.map(t => card(t, { showProject: true, showTheme: true })).join('')}</div></section>`;
  }
  return db.projects.map(p => {
    const l = list.filter(t => t.projectId === p.id);
    return l.length ? `<div class="group-title"><span class="dot" style="background:${p.color}"></span>${esc(p.name)} <span class="n" style="color:var(--muted);font-weight:500">${l.length}</span></div>
      <div class="list">${l.map(t => card(t, { showTheme: true })).join('')}</div>` : '';
  }).join('');
}

function card(t, { showTheme, showProject } = {}) {
  const p = project(t.projectId) || { color: '#999', name: '?' };
  const th = theme(t.themeId);
  const doneSubs = t.subgoals.filter(s => s.done).length;
  const est = totalEst(t);
  const nsd = nextSubDeadline(t);
  const meta = [];
  if (showProject) meta.push(`<span class="proj-tag" style="color:${p.color}">${esc(p.name)}</span>`);
  if (t.subgoals.length) meta.push(`<span>${doneSubs}/${t.subgoals.length} sous-objectifs${est ? `, environ ${fmtDur(est)}` : ''}</span>`);
  else if (est) meta.push(`<span>environ ${fmtDur(est)}</span>`);
  if (nsd) meta.push(`<span ${daysFromToday(nsd) < 0 ? 'style="color:var(--danger);font-weight:600"' : ''}>Prochaine échéance : ${fmtDate(nsd)}</span>`);
  if (showTheme && th) meta.push(`<span class="theme-tag">${esc(th.name)}</span>`);
  const isOpen = ui.open[t.id];

  return `<article class="card ${t.flagged && !t.done ? 'flag' : ''} ${t.done ? 'done' : ''}" style="--c:${p.color}">
    <div class="card-main">
      <button class="check ${t.done ? 'on' : ''}" data-action="toggle-done" data-id="${t.id}" title="Terminer">${t.done ? '✓' : ''}</button>
      <div class="body" data-action="expand" data-id="${t.id}">
        <span class="title">${esc(t.title)}</span>${t.due ? `<span class="pill ${daysFromToday(t.due) < 0 && !t.done ? 'late' : ''}">${fmtDate(t.due)}</span>` : ''}
        ${meta.length ? `<div class="meta">${meta.join('')}</div>` : ''}
      </div>
    </div>
    ${isOpen && t.subgoals.length ? `<div class="subs">${t.subgoals.map(s => `
      <div class="subrow ${s.done ? 'done' : ''}">
        <button class="check ${s.done ? 'on' : ''}" data-action="toggle-sub" data-id="${t.id}" data-sub="${s.id}">${s.done ? '✓' : ''}</button>
        <span class="t">${esc(s.title)}</span>
        ${s.due ? `<span class="m ${!s.done && daysFromToday(s.due) < 0 ? 'late' : ''}">${fmtDate(s.due)}</span>` : ''}
        ${s.est ? `<span class="m">${fmtDur(s.est)}</span>` : ''}
      </div>`).join('')}</div>` : ''}
    <div class="actions">
      <button class="icon" data-action="edit-task" data-id="${t.id}" title="Modifier">✎</button>
      <button class="icon flagbtn ${t.flagged ? 'on' : ''}" data-action="flag" data-id="${t.id}" title="Priorité">⚑</button>
    </div>
  </article>`;
}

/* ---------- Modale tâche ---------- */
const dlg = document.getElementById('dlg');
let draft = null;

function openTask(id) {
  const t = db.tasks.find(x => x.id === id);
  draft = JSON.parse(JSON.stringify(t));
  renderTaskModal();
  dlg.showModal();
}

function renderTaskModal() {
  const t = draft;
  dlg.innerHTML = `<form class="modal" data-form="task" method="dialog">
    <h3>Modifier la tâche</h3>
    <div class="field"><label>Titre</label><input class="input" name="title" value="${esc(t.title)}" required></div>
    <div class="grid2">
      <div class="field"><label>Projet</label><select name="projectId" data-change="draft-project">${db.projects.map(p => `<option value="${p.id}" ${p.id === t.projectId ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Thématique</label><select name="themeId">${themeOptions(t.projectId, t.themeId)}</select></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Date limite</label><input class="input" type="date" name="due" value="${t.due || ''}"></div>
      <div class="field"><label>Estimation globale</label><input class="input" name="est" value="${t.est ? fmtDur(t.est) : ''}" placeholder="ex. 1h30" ${t.subgoals.length ? 'disabled title="Calculée à partir des sous-objectifs"' : ''}></div>
    </div>
    ${t.subgoals.length ? '<p class="hint">Avec des sous-objectifs, l\'estimation est la somme de leurs durées.</p>' : ''}
    <label class="check-line"><input type="checkbox" name="flagged" ${t.flagged ? 'checked' : ''}> Priorité (drapeau rouge)</label>

    <div class="field"><label>Sous-objectifs</label></div>
    ${t.subgoals.length ? `<div class="sub-head"><span></span><span>Intitulé</span><span>Échéance</span><span>Durée</span><span></span></div>` : ''}
    ${t.subgoals.map(s => `<div class="sub-edit" data-sub="${s.id}">
      <input type="checkbox" data-f="done" ${s.done ? 'checked' : ''}>
      <input class="input" data-f="title" value="${esc(s.title)}" placeholder="Sous-objectif">
      <input class="input d" type="date" data-f="due" value="${s.due || ''}">
      <input class="input e" data-f="est" value="${s.est ? fmtDur(s.est) : ''}" placeholder="1h30">
      <button type="button" class="icon" data-action="del-sub" data-sub="${s.id}" title="Supprimer">×</button>
    </div>`).join('')}
    <button type="button" class="btn small" data-action="add-sub">+ Ajouter un sous-objectif</button>

    <div class="modal-foot">
      <button type="button" class="btn danger" data-action="delete-task">Supprimer</button>
      <div class="right">
        <button class="btn primary">Enregistrer</button>
        <button type="button" class="btn" data-action="close">Annuler</button>
      </div>
    </div>
  </form>`;
}

// Recopie le formulaire de la modale dans le brouillon (avant re-rendu ou enregistrement)
function readDraft() {
  const f = dlg.querySelector('form');
  draft.title = f.title.value.trim() || draft.title;
  draft.projectId = f.projectId.value;
  draft.themeId = f.themeId.value || null;
  draft.due = f.due.value || null;
  if (!f.est.disabled) draft.est = parseDur(f.est.value);
  draft.flagged = f.flagged.checked;
  f.querySelectorAll('.sub-edit').forEach(row => {
    const s = draft.subgoals.find(x => x.id === row.dataset.sub);
    const v = k => row.querySelector(`[data-f="${k}"]`);
    s.done = v('done').checked; s.title = v('title').value.trim();
    s.due = v('due').value || null; s.est = parseDur(v('est').value);
  });
}

/* ---------- Modale projet ---------- */
let projDraft = null;
function openProject(id) {
  const p = id ? project(id) : { id: null, name: '', color: PALETTE[db.projects.length % PALETTE.length], objective: '' };
  projDraft = { ...p };
  renderProjectModal();
  dlg.showModal();
}
function renderProjectModal() {
  const p = projDraft;
  dlg.innerHTML = `<form class="modal" data-form="project" method="dialog">
    <h3>${p.id ? 'Modifier le projet' : 'Nouveau projet'}</h3>
    <div class="field"><label>Nom</label><input class="input" name="name" value="${esc(p.name)}" required autofocus></div>
    <div class="field"><label>Couleur</label><div class="colors">${PALETTE.map(c => `<button type="button" class="swatch ${c === p.color ? 'on' : ''}" style="background:${c}" data-action="color" data-id="${c}"></button>`).join('')}</div></div>
    <div class="modal-foot">
      ${p.id ? `<button type="button" class="btn danger" data-action="delete-project">Supprimer le projet</button>` : ''}
      <div class="right"><button class="btn primary">Enregistrer</button><button type="button" class="btn" data-action="close">Annuler</button></div>
    </div>
  </form>`;
}

/* ---------- Confirmation / saisie dans la page ---------- */
const askDlg = document.getElementById('ask');
// Résout avec true (ou le texte saisi) si validé, null si annulé
function ask(message, { input = null, area = false, ok = 'Confirmer', danger = false, cancel = true } = {}) {
  askDlg.innerHTML = `<form class="modal" method="dialog">
    <p style="margin:0 0 14px;font-size:17px">${esc(message)}</p>
    ${input === null ? '' : area ? `<textarea id="ask-input" class="input ask-area">${esc(input)}</textarea>` : `<input id="ask-input" class="input" style="width:100%" value="${esc(input)}">`}
    <div class="modal-foot"><div class="right">
      <button class="btn ${danger ? 'danger' : 'primary'}" value="ok">${ok}</button>
      ${cancel ? '<button class="btn" value="cancel" formnovalidate>Annuler</button>' : ''}
    </div></div></form>`;
  askDlg.returnValue = '';
  askDlg.showModal();
  const field = askDlg.querySelector('#ask-input');
  if (field) { field.focus(); if (!area) field.select() }
  return new Promise(res => askDlg.addEventListener('close', () =>
    res(askDlg.returnValue === 'ok' ? (field ? field.value : true) : null), { once: true }));
}

/* ---------- Actions ---------- */
const findTask = id => db.tasks.find(t => t.id === id);
function commit() { save(); render() }

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action, id } = el.dataset;
  const t = id && findTask(id);
  switch (action) {
    case 'view': ui.view = ui.view === id ? null : id; return commit();
    case 'project': ui.project = id; ui.view = null; ui.editObjective = false; return commit();
    case 'new-project': return openProject(null);
    case 'edit-project': return openProject(id);
    case 'edit-objective': ui.editObjective = true; render(); app.querySelector('textarea')?.focus(); return;
    case 'cancel-objective': ui.editObjective = false; return render();
    case 'toggle-done': t.done = !t.done; t.doneAt = t.done ? Date.now() : null; return commit();
    case 'flag': t.flagged = !t.flagged; return commit();
    case 'expand': ui.open[id] = !ui.open[id]; return commit();
    case 'toggle-sub': { const s = t.subgoals.find(x => x.id === el.dataset.sub); s.done = !s.done; return commit() }
    case 'edit-task': return openTask(id);
    case 'toggle-theme': { const th = theme(id); th.collapsed = !th.collapsed; return commit() }
    case 'rename-theme': { const th = theme(id); const n = await ask('Nouveau nom de la thématique', { input: th.name, ok: 'Renommer' }); if (n && n.trim()) { th.name = n.trim(); commit() } return }
    case 'delete-theme': {
      const th = theme(id);
      if (!await ask(`Supprimer la thématique « ${th.name} » ? Ses tâches passeront dans « Sans thématique ».`, { ok: 'Supprimer', danger: true })) return;
      db.tasks.forEach(x => { if (x.themeId === id) x.themeId = null });
      db.themes = db.themes.filter(x => x.id !== id);
      return commit();
    }
    // Modale tâche
    case 'add-sub': readDraft(); draft.subgoals.push({ id: uid(), title: '', due: null, est: 0, done: false }); renderTaskModal(); dlg.querySelector('.sub-edit:last-of-type [data-f="title"]')?.focus(); return;
    case 'del-sub': readDraft(); draft.subgoals = draft.subgoals.filter(s => s.id !== el.dataset.sub); return renderTaskModal();
    case 'delete-task':
      if (!await ask('Supprimer cette tâche ?', { ok: 'Supprimer', danger: true })) return;
      db.tasks = db.tasks.filter(x => x.id !== draft.id); dlg.close(); return commit();
    // Modale projet
    case 'color': projDraft.name = dlg.querySelector('[name=name]').value; projDraft.color = id; return renderProjectModal();
    case 'delete-project': {
      const n = db.tasks.filter(x => x.projectId === projDraft.id).length;
      if (!await ask(`Supprimer « ${projDraft.name} » et ses ${n} tâche(s) ? C'est définitif.`, { ok: 'Supprimer', danger: true })) return;
      db.tasks = db.tasks.filter(x => x.projectId !== projDraft.id);
      db.themes = db.themes.filter(x => x.projectId !== projDraft.id);
      db.projects = db.projects.filter(x => x.id !== projDraft.id);
      ui.project = db.projects[0]?.id || null; dlg.close(); return commit();
    }
    case 'close': return dlg.close();
    case 'export': {
      const json = JSON.stringify(db);
      if (!await ask('Voici ta sauvegarde. Copie-la et garde-la dans une note ou un fichier.', { input: json, area: true, ok: 'Copier' })) return;
      try { await navigator.clipboard.writeText(json); await ask('Sauvegarde copiée.', { ok: 'OK', cancel: false }) }
      catch { await ask('Copie automatique impossible : sélectionne le texte et copie-le à la main.', { input: json, area: true, ok: 'Fermer', cancel: false }) }
      return;
    }
    case 'import': {
      const txt = await ask('Colle ici une sauvegarde. Elle remplacera toutes les données actuelles.', { input: '', area: true, ok: 'Importer', danger: true });
      if (!txt) return;
      try {
        const data = JSON.parse(txt);
        if (!Array.isArray(data.projects) || !Array.isArray(data.tasks)) throw new Error();
        db = { projects: data.projects, themes: data.themes || [], tasks: data.tasks };
        ui.project = db.projects[0]?.id || null; ui.view = null; commit();
      } catch { ask("Ce texte n'est pas une sauvegarde valide. Utilise le texte complet donné par « Exporter ».", { ok: 'OK', cancel: false }) }
      return;
    }
  }
});

document.addEventListener('change', e => {
  const k = e.target.dataset.change;
  if (k === 'quick-project') e.target.form.theme.innerHTML = themeOptions(e.target.value);
  if (k === 'draft-project') { readDraft(); draft.themeId = null; renderTaskModal() }
});

document.addEventListener('submit', e => {
  const f = e.target, kind = f.dataset.form;
  if (!kind) return;
  e.preventDefault();
  if (kind === 'quick') {
    const title = f.title.value.trim();
    if (!title) return f.title.focus();
    db.tasks.push({ id: uid(), projectId: f.project.value, themeId: f.theme.value || null, title, due: null, flagged: false, done: false, est: 0, subgoals: [], createdAt: Date.now() });
    ui.project = f.project.value; ui.view = null;
    const keepTheme = f.theme.value;
    commit();
    const nf = app.querySelector('[data-form=quick]'); nf.theme.value = keepTheme; nf.title.focus();
  }
  if (kind === 'theme') {
    const name = f.name.value.trim();
    if (!name) return;
    db.themes.push({ id: uid(), projectId: ui.project, name, collapsed: false });
    commit();
  }
  if (kind === 'objective') {
    project(ui.project).objective = f.objective.value.trim();
    ui.editObjective = false; commit();
  }
  if (kind === 'task') {
    readDraft();
    draft.subgoals = draft.subgoals.filter(s => s.title);
    const i = db.tasks.findIndex(x => x.id === draft.id);
    db.tasks[i] = draft; dlg.close(); commit();
  }
  if (kind === 'project') {
    projDraft.name = f.name.value.trim();
    if (!projDraft.name) return;
    if (projDraft.id) Object.assign(project(projDraft.id), projDraft);
    else { projDraft.id = uid(); db.projects.push(projDraft); ui.project = projDraft.id; ui.view = null }
    dlg.close(); commit();
  }
});

// Fermer la modale en cliquant hors du cadre
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close() });

render();
</script>
</body>
</html>
